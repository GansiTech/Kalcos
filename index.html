<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:start-->
    <title>Kalcos Zapatería | Calzado para toda la familia en Hermosillo</title>
    <meta name="description" content="Zapatería en Hermosillo, Sonora. Calzado para dama, caballero y niños, botas, tenis, escolar y remate." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://kalcos.com.mx/" />
    <meta property="og:title" content="Kalcos Zapatería" />
    <meta property="og:description" content="Calzado para toda la familia en Hermosillo, Sonora." />
    <meta property="og:url" content="https://kalcos.com.mx/" />
    <meta name="twitter:title" content="Kalcos Zapatería" />
    <meta name="twitter:description" content="Calzado para toda la familia en Hermosillo, Sonora." />
    <!--seo:end-->

    <!--
      Verificación de dominio de Meta (Business Manager > Seguridad de la marca > Dominios).
      No edites el valor aquí: se toma de VITE_FACEBOOK_DOMAIN_VERIFICATION (.env) o de
      `metaVerificacionDominio` en src/data/empresa.ts al hacer el build.
    -->
    <meta name="facebook-domain-verification" content="%FACEBOOK_DOMAIN_VERIFICATION%" />

    <meta name="theme-color" content="#F5EFE4" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Kalcos Zapatería" />
    <meta property="og:image" content="https://kalcos.com.mx/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el primer pintado: se cargan en paralelo y se aplican al llegar (display=swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
    <!--schema-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
